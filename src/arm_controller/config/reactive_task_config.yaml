neo_example:
  task_velocity:
    kp_pos: [1.2, 1.2, 1.2]
    ko_ori: [1.2, 1.2, 1.2]
    max_linear_speed: 0.35
    max_angular_speed: 0.35
    position_deadband: 1.0e-4
    orientation_deadband: 1.0e-4

  # Example target used by example_reactive_qp_neo.
  target_translation_xyz: [0.05, -0.02, 0.01]

  # Obstacle scenario parameters (used by dummy obstacle in the example).
  obstacle_distance: 0.12

  # QP build/tuning parameters.
  qp_build:
    enable_joint_limit_damper: true # true
    enable_obstacle_damper: true # true
    slack_abs_bound: 1.0

    hessian:
      task_tracking_weight: 2.0
      joint_velocity_weight:  0.002 # 5.0e-3
      slack_weight: 100.0
      posture_weight: 0.008  # 0.01
      manipulability_weight: 0.0002 # 0.01

    joint_limit_damper:
      safety_distance: 0.08
      influence_distance: 0.25
      cbf_gain_lower: 2.0
      cbf_gain_upper: 2.0

    obstacle_damper:
      safety_distance: 0.025
      influence_distance: 0.06
      cbf_gain: 2.0

  manipulability:
    determinant_damping: 1.0e-8 # M = J * J^T + damping * I
    link_name: ""
    point_in_link: [0.0, 0.0, 0.0]


neo_joint_preference:
  # qdot_ref = posture_k * (preferred_center - q_current)
  posture_k: 1.0
  joints:
    # Baseline (URDF-consistent) debug defaults:
    # - enable_range_clamp=false (do not tighten URDF joint limits)
    # - posture_weight=0.0 (disable posture tendency)
    left_joint1:  { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }
    left_joint2:  { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    left_joint3:  { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    left_joint4:  { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }
    left_joint5:  { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    left_joint6:  { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }

    right_joint1: { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }
    right_joint2: { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    right_joint3: { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    right_joint4: { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }
    right_joint5: { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    right_joint6: { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }

    joint1:       { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }
    joint2:       { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    joint3:       { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    joint4:       { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }
    joint5:       { enable_range_clamp: false, preferred_min: -1.571, preferred_max: 1.571, preferred_center: 0.000, posture_weight: 0.000 }
    joint6:       { enable_range_clamp: false, preferred_min: -2.967, preferred_max: 2.967, preferred_center: 0.000, posture_weight: 0.000 }

reactive_task_controller:
  max_control_ticks: 120
  neo_control_cycle_sec: 0.01
  goal_position_tolerance: 0.01
  goal_orientation_tolerance_rad: 0.10

  request:
    safe_distance: 0.05 # desired clearance shell for A*
    hard_clearance: 0.0 # true collision threshold used by safety checks
    goal_tolerance: 0.03
    map_margin_xyz: [0.60, 0.60, 0.60]
    whole_body_postcheck_non_blocking: false
    whole_body_postcheck_max_attempts: 5
    whole_body_retry_forbidden_radius: 0.045
    whole_body_retry_pushout_distance: 0.02
    whole_body_segment_check_step_m: 0.10

  map_source: camera_driver_esdf

  camera_driver_pointcloud:
    pointcloud_topic: /camera_driver/obstacle_pointcloud
    pointcloud_queue_depth: 2
    voxel_size_m: 0.05
    max_distance_m: 0.60
    observation_margin_m: 0.15
    isolated_min_neighbor_count: 4
    isolated_neighbor_radius_cells: 1

  camera_driver_esdf:
    service_name: /camera_driver/query_distance_field
    request_timeout_ms: 200
    startup_wait_timeout_ms: 1000
    cache_max_entries: 8192

  dummy_obstacle:
    enable: false
    radius: 0.035
    center_left_arm: [0.25, -0.52, 0.60]
    center_right_arm: [0.07, 0.52, 0.72]

  replanner:
    segment_sample_step_m: 0.04
    replan_every_control_ticks: 1000000 # 40
    control_cycle_sec: 0.10
    prediction_horizon_ticks: 10
    planning_latency_sec: 0.06
    handoff_blend_points: 8

  planner:
    common:
      default_segment_speed: 0.20
      enable_interpolator_smoothing: true
      interpolator_continuity_order: 2
      interpolator_target_dt: 0.01
      enable_minimum_snap_optimization: true
      minimum_snap_iterations: 100
      minimum_snap_data_weight: 0.20
      minimum_snap_weight: 0.05
      minimum_snap_relaxation: 0.50
    astar:
      voxel_resolution: 0.015
      neighbor_mode: 18
      use_se3_search: true
      orientation_bin_size_rad: 0.7853981634
      orientation_goal_tolerance_rad: 1.20
      enable_inplace_rotation_neighbors: true # false
      goal_orientation_only: true
      goal_orientation_blend_distance: 0.15
      force_axis_translation_neighbors_in_se3: true
      obstacle_penalty_weight: 1.2
      corridor_deviation_weight: 3.0
      whole_body_penalty_weight: 3.0
      whole_body_penalty_margin: 0.06
      whole_body_hard_reject_margin: -0.08
      whole_body_reject_on_ik_fail: false
      goal_shortcut_clearance_margin: 0.02
      orientation_cost_weight: 0.08
      orientation_heuristic_weight: 0.20
      max_iterations: 3000000
      max_planning_time_sec: 12.0
      edge_check_step: 0.005
    smoothing:
      max_shortcut_trials: 50
      collision_check_step: 0.005
      local_adjust_iterations: 15
      local_adjust_alpha: 0.30

  mit:
    kp: 0.0
    kd: 0.01
    max_motors: 6
