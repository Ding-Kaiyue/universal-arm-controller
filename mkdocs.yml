site_name: Universal Arm Controller
site_description: 通用工业机械臂控制系统文档
site_url: https://Ding-Kaiyue.github.io/universal-arm-controller
repo_url: https://github.com/Ding-Kaiyue/universal-arm-controller
repo_name: universal-arm-controller

theme:
  name: material
  language: zh
  palette:
    - scheme: light
      primary: blue
      accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: zh
  - mermaid2

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - assets/js/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css

docs_dir: docs
site_dir: site

nav:
  - 首页: index.md
  - 技术概览: overview/TECHNICAL_OVERVIEW.md
  - 快速开始: getting_started/README.md
  - 系统集成: system_integrator/README.md
  - 开发者指南:
    - 架构设计: developer/ARCHITECTURE.md
    - 算法文档:
      - CSAPS平滑: developer/algorithms/CSAPS.md
      - 时间参数化: developer/algorithms/TOTG.md
      - 轨迹插值: developer/algorithms/TRAJECTORY_INTERPOLATION.md
      - 逆运动学: developer/algorithms/INVERSE_KINEMATICS.md
      - 重力补偿: developer/algorithms/GRAVITY_COMPENSATION.md
      - 笛卡尔速度: developer/algorithms/CARTESIAN_VELOCITY.md
